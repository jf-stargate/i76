name: I76 reconstruction build and tests

# Untrusted candidate source is executed only in a read-only pull_request context.
# Do not convert this to pull_request_target or expose secrets/write tokens.
on:
  pull_request:
    paths:
      - 'reconstruction/**'
      - '.github/workflows/reconstruction-ci.yml'
  push:
    branches: [main]
    paths:
      - 'reconstruction/**'
      - '.github/workflows/reconstruction-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: i76-reconstruction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gcc:
    name: linux-gcc-ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure debug
        run: cmake -S reconstruction -B build/gcc -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/gcc --parallel
      - name: Unit and functional tests
        run: ctest --test-dir build/gcc --output-on-failure --no-tests=error

  linux-clang:
    name: linux-clang-ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure debug
        run: cmake -S reconstruction -B build/clang -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/clang --parallel
      - name: Unit and functional tests
        run: ctest --test-dir build/clang --output-on-failure --no-tests=error

  windows-msvc:
    name: windows-msvc-ctest
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S reconstruction -B build/windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build/windows --config Debug --parallel
      - name: Unit and functional tests
        run: ctest --test-dir build/windows -C Debug --output-on-failure --no-tests=error

  linux-sanitizers:
    name: linux-asan-ubsan-ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S reconstruction -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DI76_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/asan --parallel
      - name: Sanitizer unit and functional tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/asan --output-on-failure --no-tests=error

  linux-coverage:
    name: linux-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install coverage reporter
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure
        run: cmake -S reconstruction -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DI76_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build/coverage --parallel
      - name: Coverage tests
        run: ctest --test-dir build/coverage --output-on-failure --no-tests=error
      - name: Measure first-party core coverage
        # Branch coverage is advisory until the approved diff-based 80% policy
        # is implemented; the initial command parser contains compiler-generated
        # exception branches not reachable through normal input tests.
        run: gcovr --root . --filter 'reconstruction/src/' --print-summary --fail-under-line 90

  linux-valgrind:
    name: linux-valgrind-memcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure (not sanitized)
        run: cmake -S reconstruction -B build/memcheck -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/memcheck --parallel
      - name: Memcheck on registered unit/functional tests
        run: python3 reconstruction/tools/valgrind_ctest.py --build-dir build/memcheck --tool memcheck
      - name: Helgrind (only when threaded tests are registered)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 reconstruction/tools/valgrind_ctest.py --build-dir build/memcheck --tool helgrind
